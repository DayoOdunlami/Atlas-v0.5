name: Atlas Eval Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live artifact contract gate (requires API keys)
        required: false
        default: false
        type: boolean

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt

      - name: Citation guard tests
        run: python agents/test_citation_guard.py

      - name: Turn intent tests
        run: python agents/test_turn_intent.py

      - name: Artifact QA tests
        run: python agents/test_artifact_qa.py

      - name: Falsification tests
        run: python agents/test_falsification.py

      - name: Artifact contract gate (offline)
        run: python eval/test_artifact_contract_live.py

      - name: Orchestrator eval suite
        env:
          ATLAS5_ORCHESTRATOR_V1: "true"
          ATLAS5_HARMONIZED_EVIDENCE_V1: "true"
        run: |
          pip install pytest
          python agents/test_session_lanes.py
          python agents/test_presentation.py
          pytest agents/test_evidence_router_lanes.py agents/test_reconcile_harmonized.py agents/test_harmonized_evidence.py agents/test_retrieval_fabric.py agents/test_evidence_pipeline.py agents/test_multiturn_context.py agents/test_atlas_v5_run_turn.py -q

      - name: Graph compiles
        run: python -m py_compile agents/atlas/graph.py agents/atlas/artifact_qa.py agents/atlas/falsification.py agents/atlas/citation_guard.py

  live-gate:
    needs: offline-gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt

      - name: Live artifact contract gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python eval/test_artifact_contract_live.py --live
