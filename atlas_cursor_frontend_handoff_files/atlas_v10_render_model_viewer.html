let cq="cq.match.workbench";
function init(){document.getElementById("modelsel").innerHTML=Object.keys(MODELS).map(k=>`<option value="${k}" ${k===cq?"selected":""}>${k}</option>`).join("");render()}
function setModel(id){cq=id;document.getElementById("modelsel").value=id;render()}
function model(){return MODELS[cq]}
function render(){const m=model();document.getElementById("cqctx").textContent=m.canonical_question_id;document.getElementById("layoutctx").textContent=m.layout_template;document.getElementById("blockctx").textContent=m.blocks.length;document.getElementById("artifact").innerHTML=header(m)+body(m);document.getElementById("debugPre").textContent=JSON.stringify(m,null,2)}
function header(m){return `<div class="artifactHeader"><div><div class="kicker">${m.mode} · ${m.layout_template}</div><div class="h1">${m.source_object.title}</div><div class="subtitle">Target: ${m.target_object.title}. This view renders from the normalised AtlasRenderModel.</div></div><div class="headerActions"><span class="pill purple">${m.canonical_question_id}</span><span class="pill green">Render model</span><span class="pill amber">${m.decision_spine.confidence_tier}</span></div></div>`}
function body(m){const blocks=m.blocks;return `<div class="body">${trust(m)}${renderRecommendation(m)}${blocks.map(b=>renderBlock(b)).join("")}</div>`}
function trust(m){return `<div class="trustStrip"><div class="card"><div class="label">Decision</div><div class="big amber">${m.decision_spine.decision}</div><div class="small">${m.decision_spine.recommendation}</div></div><div class="card"><div class="label">Confidence</div><div class="big amber">${m.decision_spine.confidence_tier}</div><div class="stackbar"><span class="seg self"></span></div><div class="rule">${m.decision_spine.confidence_cap_reason}</div></div><div class="card"><div class="label">Score / value</div><div class="big purple">${Math.round(m.decision_spine.score*100)}%</div><div class="small">Gap value estimate: £${m.decision_spine.economic_gap_value.toLocaleString()}</div></div></div>`}
function renderRecommendation(m){if(!m.blocks.find(b=>b.type==="RecommendationConfidence"))return "";return `<section class="zone"><div class="zoneHead"><div class="zoneTitle">Decision spine</div><span class="pill amber">from render model</span></div><div class="zoneBody"><div class="decision"><div class="decisionMain"><h2>${m.decision_spine.recommendation}</h2><p>${m.decision_spine.summary}</p><div class="morphs"><button class="morph" onclick="openInspector('confidence')">Why confidence?</button><button class="morph amber" onclick="setModel('cq.match.act')">Act</button><button class="morph" onclick="setModel('cq.match.defend')">Defend</button></div></div><div class="card soft"><div class="label">Source → target</div>${m.source_object.title}<br><br><b>${m.target_object.title}</b></div></div></div></section>`}
function renderBlock(b){if(b.type==="RecommendationConfidence"||b.type==="EvidenceStateSummary")return "";let inner="";if(b.type==="DimensionGap")inner=renderGaps(b.content);else if(b.type==="MatchBench")inner=renderEvidenceMap(b.content);else if(b.type==="ClaimLedger")inner=renderClaims(b.content);else if(b.type==="ActionPlan")inner=renderActions(b.content);else if(b.type==="ObjectionResponse")inner=renderObjections(b.content);else if(b.type==="ProvenanceTrace")inner=renderTrace(b.content);else if(b.type==="ComparisonMatrix")inner=renderBrowse(b.content);else if(b.type==="ContextCard")inner=renderContext(b.content);else inner=`<pre>${JSON.stringify(b.content,null,2)}</pre>`;return `<section class="zone"><div class="zoneHead"><div><div class="zoneTitle">${b.type}</div><div class="small">${b.headline}</div></div><span class="pill blue">${b.visual}</span></div><div class="zoneBody">${inner}</div></section>`}
function renderGaps(items){return items.map(g=>`<div class="gaprow" onclick="openInspector('${g.id}')"><div><b>${g.title}</b><div class="small">${g.description}</div></div><div class="gapbar ${g.magnitude}"><span></span></div><div class="gapbadge ${g.magnitude}">${g.magnitude}</div></div>`).join("")}
function renderEvidenceMap(items){return `<table class="audit"><tr><th>Claim</th><th>Verdict</th><th>Evidence</th><th>Provenance</th></tr>${items.map(e=>`<tr class="clickable" onclick="openInspector('${e.id}')"><td>${e.claim_text}</td><td>${e.verdict}</td><td><span class="tag ${e.evidence_state==='self-reported'?'self':'inferred'}">${e.evidence_state}</span></td><td><span class="tag stored">${e.provenance}</span></td></tr>`).join("")}</table>`}
function renderClaims(items){return `<table class="audit"><tr><th>Claim</th><th>Evidence</th><th>Provenance</th><th>Mapped verdict</th></tr>${items.map(c=>`<tr class="clickable" onclick="openInspector('${c.id}')"><td>${c.claim_text}</td><td><span class="tag self">${c.evidence_state}</span></td><td>${c.provenance}</td><td>${c.evidence_map_verdict}</td></tr>`).join("")}</table>`}
function renderActions(items){return `<div class="timeline">${items.map(a=>`<div class="step"><div class="num">${a.sequence}</div><b>${a.action}</b><div class="small">Owner: ${a.owner}<br>Linked gap: ${a.linked_gap}</div></div>`).join("")}</div>`}
function renderObjections(items){return items.map(o=>`<div class="objection"><div><b>Challenge</b><br>${o.challenge}</div><div><b>Response</b><br>${o.response}</div><div><span class="tag ${o.evidence_state==='self-reported'?'self':'inferred'}">${o.evidence_state}</span></div></div>`).join("")}
function renderTrace(c){return `<div class="path">${c.path.map(p=>`<span>${p}</span>`).join("→")}</div><p>Evidence items: ${c.evidence_map_items.length}; gaps: ${c.gap_items.length}</p>`}
function renderBrowse(items){return `<table class="audit"><tr><th>Match</th><th>Passport</th><th>Target</th><th>Score</th></tr>${items.map(i=>`<tr class="clickable" onclick="setModel('cq.match.workbench')"><td>${i.match_id}</td><td>${i.passport}</td><td>${i.target}</td><td>${Math.round(i.score*100)}%</td></tr>`).join("")}</table>`}
function renderContext(c){return `<div class="grid2"><div class="card soft"><div class="label">Source</div><b>${c.source.title}</b></div><div class="card soft"><div class="label">Target</div><b>${c.target.title}</b></div></div>`}
function openInspector(id){const m=model();const item=m.inspector_index[id]||m.inspector_index["confidence"];document.getElementById("inspectorTitle").textContent=item.title;document.getElementById("inspectorBody").innerHTML=`<p><span class="pill blue">${item.kind}</span></p><pre style="white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:12px;border-radius:10px;overflow:auto">${escapeHtml(JSON.stringify(item.content,null,2))}</pre>`;document.getElementById("inspector").classList.add("open")}
function closeInspector(){document.getElementById("inspector").classList.remove("open")}function toggleDebug(){document.getElementById("debug").classList.toggle("open")}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
init();
</script>
</body>
</html>
